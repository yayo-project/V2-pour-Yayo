[build]
  publish = "."

# Netlify rewrites every link in the served HTML to drop ".html", so the repo
# says acheter.html, the canonical says acheter.html, the sitemap says
# acheter.html — and the page Google downloads links to /acheter. Google
# follows the links, indexes that, and overrides the canonical, which is the
# "Duplicate, Google chose different canonical than user" report. Turning the
# rewrite off makes the links, the canonical and the sitemap say one thing.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

# /sitemap.xml is generated live so every real listing is indexed by Google
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Every car gets a real address with its name in it, served with the title,
# photo, price and structured data already in the HTML — so Google indexes it
# and WhatsApp/Facebook show the car instead of the Yayo logo.
[[redirects]]
  from = "/voiture/*"
  to = "/.netlify/functions/car-page"
  status = 200
  force = true

# Old ?id= links go through the same renderer. Without this their raw HTML
# still carries the shell's canonical (/voiture.html), so every car would tell
# Google it is the same page until JavaScript ran.
[[redirects]]
  from = "/voiture.html"
  query = {id = ":id"}
  to = "/.netlify/functions/car-page?id=:id"
  status = 200
  force = true

# car-page.js serves the real voiture.html shell, so it must be bundled with it
[functions."car-page"]
  included_files = ["voiture.html"]

# Weekly founder digest — every Monday 08:00 UTC (12:00 Dubai)
[functions."weekly-stats"]
  schedule = "0 8 * * 1"

# Nightly: put extra cars to sleep when a promo ends, wake them when there's room
[functions."reconcile-limits"]
  schedule = "0 2 * * *"

# Nightly: remind a seller before his trade licence expires, and take the
# Vérifié badge off by itself the day it does (§50)
[functions."licence-watch"]
  schedule = "30 3 * * *"
